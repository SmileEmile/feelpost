appId: dev.feelpost.app
productName: FeelPost
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/grammars
    to: grammars
asar: true
asarUnpack:
  - out/main/scan-worker.js
  - out/main/chunks/**
mac:
  icon: resources/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip
win:
  icon: resources/icon.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-x64-Setup.${ext}
portable:
  artifactName: ${productName}-${version}-x64-Portable.${ext}
