<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FeelPost · 项目</title>
  <link rel="stylesheet" href="assets/css/main.css" />
  <script>
    (function () {
      try {
        var s = localStorage.getItem('feelpost.prototype.v1');
        if (s) {
          var d = JSON.parse(s);
          if (d.theme) document.documentElement.dataset.theme = d.theme;
        }
      } catch (e) { /* noop */ }
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="page-top">
      <a class="brand" href="index.html" aria-label="FeelPost 首页">
        <span class="brand-mark">{ }</span>
        <span class="brand-name">FeelPost</span>
      </a>
      <span class="chip muted soft">本地原型 · 数据仅存本机</span>
      <div class="spacer"></div>
      <a class="btn btn-sm" href="ai.html">AI 模块原型</a>
      <button class="btn btn-ghost btn-sm" data-act="reset">重置演示数据</button>
      <button class="btn btn-primary" data-act="new">
        <svg class="icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建项目
      </button>
      <button class="icon-btn" data-act="theme" title="切换主题" aria-label="切换主题"></button>
    </header>
    <main class="page-main" id="page"></main>
  </div>
  <div id="toast-root"></div>
  <div id="modal-root"></div>

  <script src="assets/js/util.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/page-projects.js"></script>

</body>
</html>
