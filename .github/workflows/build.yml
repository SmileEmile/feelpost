name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      - run: npx electron-builder --mac --arm64 --x64 --publish never
      - name: Verify ad-hoc signed macOS apps
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' app; do
            found=1
            echo "Verifying $app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find release -maxdepth 3 -name 'FeelPost.app' -print0)
          if [[ "$found" -eq 0 ]]; then
            echo "No FeelPost.app found under release/" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: feelpost-mac
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run release:check
      - name: Build Windows x64
        run: npx electron-builder --win --x64 --publish never
      - name: Build Windows ARM64
        run: npx electron-builder --win --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: feelpost-windows
          if-no-files-found: error
          path: release/*.exe

  release:
    needs:
      - mac
      - windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: meta
        name: Resolve release tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=FeelPost ${TAG}" >> "$GITHUB_OUTPUT"

      - id: notes
        name: Generate release notes from CHANGELOG
        run: node scripts/release-notes.mjs "${{ steps.meta.outputs.tag }}"

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: |
            release-assets/feelpost-mac/*.dmg
            release-assets/feelpost-mac/*.zip
            release-assets/feelpost-windows/*.exe
          body_path: release-notes.md
          draft: false
          prerelease: false
          overwrite_files: true
